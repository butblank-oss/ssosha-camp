<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>캠핑수첩</title>
<meta name="description" content="때찌·때꾸와 평일 캠핑 갈 캠핑장 후보와 캠프닉 장소 모음">
<meta name="theme-color" content="#1f7a5a">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏕️</text></svg>">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<!-- Pretendard (SIL OFL 1.1): 필요한 글자만 받는 CDN 판 -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="style.css?v=20261110d">
<style>html,body{margin:0;padding:0}</style>
</head>
<body>
<div class="app">
  <header class="top bleed">
    <div class="brandrow">
      <div class="logo">캠핑<span>수첩</span></div>
      <div class="who">🐶 때찌 7.5kg · 때꾸 4.5kg</div>
    </div>
    <label class="search">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="캠핑장, 지역 검색 (예: 강화, 제천)" aria-label="캠핑장 검색" autocomplete="off">
      <button class="fbtn" id="openFilter" type="button" aria-label="필터">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>
        <b id="fcount" hidden></b>
      </button>
    </label>
    <div class="syncbar" id="syncbar" hidden></div>
    <div class="cats" id="cats" role="tablist" aria-label="지역"></div>
  </header>
  <main id="view"></main>
</div>

<div class="tabbar"><nav aria-label="메뉴">
  <button class="tb" data-go="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>반려견과</button>
  <button class="tb" data-go="solo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>캠프닉</button>
  <button class="tb" data-go="saved"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 20s-7-4.4-9-9a5 5 0 0 1 9-3 5 5 0 0 1 9 3c-2 4.6-9 9-9 9z"/></svg>찜<em id="savedN" hidden></em></button>
  <button class="tb" data-go="check"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="m8 9 2 2 4-4M8 16h8"/></svg>체크리스트</button>
</nav></div>

<div class="scrim" id="scrim"></div>
<section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" hidden>
  <div class="grab" aria-hidden="true"></div>
  <div class="shead"><b id="sheetTitle"></b><button class="x" id="closeSheet" aria-label="닫기">✕</button></div>
  <div class="sbody" id="sheetBody"></div>
</section>
<noscript><p style="padding:16px">이 페이지는 자바스크립트가 켜져 있어야 보여요.</p></noscript>
<script src="config.js?v=20261110d"></script>
<script src="app.js?v=20261110d"></script>
</body>
</html>
