.sc-skin { fill: var(--s-skin); } .sc-hair-1 { fill: var(--s-hair-1); } .sc-hair-2 { fill: var(--s-hair-2); }
.sc-coat-1 { fill: var(--s-coat-1); } .sc-coat-2 { fill: var(--s-coat-2); } .sc-coat-3 { fill: var(--s-coat-3); } .sc-pants { fill: var(--s-pants); }

/* Sosha Camp v2 프로토타입
   고유 컬러: 민트 틸 하나. 버튼·선택 = --brand, 넓은 면 = --mint, 아이콘 = 틸 단색 3D
   모바일 우선, 900px 이상에서 왼쪽 메뉴 */
@font-face { font-family: "Pretendard Variable"; src: url("v2/fonts/PretendardVariable.woff2") format("woff2"); font-weight: 45 920; font-display: swap; }

:root {
  --brand: #0F766E; --brand-press: #115E59; --brand-ink: #115E59; --on-brand: #FFFFFF;
  --mint: #BDE5E0; --soft: #E6F5F3; --glow: #5EEAD4;
  --bg: #F8FAFC; --card: #FFFFFF; --ink: #0F172A; --sub: #64748B; --faint: #94A3B8;
  --line: #EEF2F6; --line-2: #E2E8F0; --tile: #F1F5F9; --dim: rgb(15 23 42 / .45);
  --must-bg: #FFE4E6; --must: #9F1239; --nice-bg: #FEF3C7; --nice: #92400E; --warn: #BE123C;
  --night-1: #151D35; --night-2: #1E2A4A; --ground: #34593E;
  --r-lg: 18px; --r: 14px; --r-sm: 10px;
  --shadow: 0 10px 30px rgb(15 23 42 / .12);
  --ease: cubic-bezier(.2, .8, .2, 1);
  --font: "Pretendard Variable", -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
  --tabbar-h: 64px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --brand: #2DD4BF; --brand-press: #5EEAD4; --brand-ink: #5EEAD4; --on-brand: #042F2E;
    --mint: #134E4A; --soft: #10292A; --bg: #0B1117; --card: #161B21; --ink: #ECEEF1; --sub: #A1A9B3; --faint: #8A939E;
    --line: #22272E; --line-2: #2C323A; --tile: #1F252C; --dim: rgb(0 0 0 / .6);
    --must-bg: #3B1220; --must: #FDA4AF; --nice-bg: #3A2A0D; --nice: #FCD34D; --warn: #FDA4AF;
    --shadow: 0 10px 30px rgb(0 0 0 / .5); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --brand: #2DD4BF; --brand-press: #5EEAD4; --brand-ink: #5EEAD4; --on-brand: #042F2E;
  --mint: #134E4A; --soft: #10292A; --bg: #0B1117; --card: #161B21; --ink: #ECEEF1; --sub: #A1A9B3; --faint: #8A939E;
  --line: #22272E; --line-2: #2C323A; --tile: #1F252C; --dim: rgb(0 0 0 / .6);
  --must-bg: #3B1220; --must: #FDA4AF; --nice-bg: #3A2A0D; --nice: #FCD34D; --warn: #FDA4AF;
  --shadow: 0 10px 30px rgb(0 0 0 / .5); color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 16px; line-height: 1.5; letter-spacing: -0.015em; word-break: keep-all; overflow-wrap: anywhere; -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; }
h1, h2, h3, p { margin: 0; }
button, input, select, textarea { font: inherit; letter-spacing: inherit; color: inherit; }
button { cursor: pointer; }
a { color: var(--brand-ink); }
img { max-width: 100%; }
[hidden] { display: none !important; }
:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; border-radius: 6px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
.skip { position: absolute; left: 12px; top: -60px; z-index: 100; padding: 8px 12px; border-radius: 8px; background: var(--ink); color: var(--card); }
.skip:focus { top: 12px; }
.num { font-variant-numeric: tabular-nums; }

/* ---------- 틀: 모바일 하단 탭바 / PC 왼쪽 메뉴 ---------- */
#view { min-height: 100dvh; padding-bottom: calc(var(--tabbar-h) + env(safe-area-inset-bottom, 0px) + 24px); outline: 0; }
.tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 40; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); padding: 0 max(8px, env(safe-area-inset-left, 0px)) env(safe-area-inset-bottom, 0px) max(8px, env(safe-area-inset-right, 0px)); background: color-mix(in srgb, var(--card) 94%, transparent); backdrop-filter: saturate(1.6) blur(12px); -webkit-backdrop-filter: saturate(1.6) blur(12px); box-shadow: 0 -1px 0 var(--line); }
.tabbar .brand { display: none; }
.tab { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; min-height: var(--tabbar-h); color: var(--faint); font-size: 11px; font-weight: 500; text-decoration: none; transition: color .15s var(--ease); }
.tab svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
.tab[aria-current="page"] { color: var(--brand); font-weight: 600; box-shadow: inset 0 2px 0 var(--brand); }
.tab[aria-current="page"] svg { fill: var(--soft); }

@media (min-width: 900px) {
  .shell { display: grid; grid-template-columns: 232px minmax(0, 1fr); }
  .tabbar { position: sticky; top: 0; height: 100dvh; display: flex; flex-direction: column; gap: 2px; padding: 22px 14px; background: var(--card); box-shadow: 1px 0 0 var(--line); backdrop-filter: none; }
  .tabbar .brand { display: flex; align-items: center; gap: 10px; padding: 0 10px 22px; color: var(--ink); font-size: 18px; font-weight: 700; letter-spacing: -0.03em; text-decoration: none; }
  .tabbar .brand img { width: 32px; height: 32px; padding: 4px; border-radius: 10px; background: var(--tile); }
  .tab { flex-direction: row; justify-content: flex-start; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: var(--r-sm); font-size: 15px; color: var(--sub); }
  .tab svg { width: 20px; height: 20px; }
  .tab:hover { background: var(--tile); color: var(--ink); }
  .tab[aria-current="page"] { box-shadow: none; background: var(--soft); color: var(--brand-ink); }
  #view { padding-bottom: 48px; }
  .page { max-width: 1040px; }
}

/* ---------- 공통 ---------- */
.page { display: flex; flex-direction: column; gap: 24px; padding: 16px 16px 0; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
@media (min-width: 900px) { .page { padding: 32px 40px 0; } }
.page-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 44px; padding: 4px 4px 0; }
.page-head h1 { font-size: 26px; font-weight: 700; letter-spacing: -0.035em; }
@media (min-width: 900px) { .page-head h1 { font-size: 30px; } }
.sec { display: flex; flex-direction: column; gap: 10px; }
.sec-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; padding: 0 4px; }
.sec-head h2 { font-size: 17px; font-weight: 700; }
.sec-head .more { font-size: 13px; color: var(--sub); background: none; border: 0; padding: 6px 0; text-decoration: none; }
.card { border-radius: var(--r-lg); background: var(--card); box-shadow: 0 0 0 1px var(--line); }
.list { display: flex; flex-direction: column; border-radius: var(--r-lg); background: var(--card); box-shadow: 0 0 0 1px var(--line); overflow: hidden; }
.muted { color: var(--sub); }
.faint { color: var(--faint); }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 48px; padding: 0 18px; border: 0; border-radius: 12px; background: var(--tile); color: var(--ink); font-size: 15px; font-weight: 600; text-decoration: none; white-space: nowrap; transition: background-color .15s var(--ease), transform .1s var(--ease); }
.btn:active { transform: scale(.97); }
.btn-primary { background: var(--brand); color: var(--on-brand); }
.btn-primary:hover { background: var(--brand-press); }
.btn-soft { background: var(--soft); color: var(--brand-ink); }
.btn-ghost { background: transparent; color: var(--sub); }
.btn-block { width: 100%; }
.btn-sm { min-height: 40px; padding: 0 14px; border-radius: 10px; font-size: 14px; }
.btn svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; }

.tag { display: inline-flex; align-items: center; height: 20px; padding: 0 7px; border-radius: 6px; font-size: 11px; font-weight: 600; white-space: nowrap; }
.tag-must { background: var(--must-bg); color: var(--must); }
.tag-nice { background: var(--nice-bg); color: var(--nice); }
.tag-later { background: var(--tile); color: var(--sub); }
.tag-lesson { background: var(--soft); color: var(--brand-ink); }
.tag-brand { background: var(--brand); color: var(--on-brand); }

.ico { position: relative; flex: none; display: grid; place-items: center; width: 44px; height: 44px; border-radius: 12px; background: var(--tile); }
.ico img { width: 30px; height: 30px; }
.ico.lg { width: 64px; height: 64px; border-radius: 18px; }
.ico.lg img { width: 44px; height: 44px; }
.ico.sm { width: 36px; height: 36px; border-radius: 10px; }
.ico.sm img { width: 24px; height: 24px; }
.ico .check { position: absolute; right: -3px; bottom: -3px; display: grid; place-items: center; width: 18px; height: 18px; border-radius: 50%; background: var(--brand); box-shadow: 0 0 0 2px var(--card); }
.ico .check svg { width: 10px; height: 10px; fill: none; stroke: var(--on-brand); stroke-width: 3.5; stroke-linecap: round; stroke-linejoin: round; }

.empty { display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 36px 16px; text-align: center; color: var(--sub); font-size: 14px; }
.empty img { width: 56px; height: 56px; opacity: .9; }

/* ---------- 홈 ---------- */
.hero { position: relative; height: clamp(440px, 118vw, 520px); background: linear-gradient(180deg, var(--night-1) 0%, var(--night-2) 44%); overflow: hidden; color: #FFFFFF; }
.hero::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 46px; background: var(--ground); }
.hero-scene { position: absolute; left: 0; right: 0; bottom: 45px; z-index: 1; aspect-ratio: 640 / 360; }
.hero-scene svg { display: block; width: 100%; height: 100%; }
.hero-scene img, .lvup-scene img { display: block; width: 100%; height: 100%; object-fit: cover; object-position: center bottom; }
.hero-scene img { -webkit-mask-image: linear-gradient(180deg, transparent 0%, #000 22%); mask-image: linear-gradient(180deg, transparent 0%, #000 22%); }
.hero { background: linear-gradient(180deg, #0E121C 0%, #141824 40%) !important; }
.hero::after { display: none; }
.hero-scene { bottom: 0 !important; }
.lvup-scene { background: #141824 !important; }
.hero-top { position: absolute; left: 0; right: 0; top: 0; z-index: 2; display: flex; align-items: center; justify-content: space-between; padding: calc(12px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) 0 max(16px, env(safe-area-inset-left, 0px)); }
.hero-brand { display: flex; align-items: center; gap: 8px; font-size: 17px; font-weight: 700; letter-spacing: -0.03em; }
.hero-brand img { width: 36px; height: 36px; padding: 6px; border-radius: 50%; background: #FFFFFF; }
.round { display: grid; place-items: center; width: 44px; height: 44px; border: 0; border-radius: 50%; background: rgb(255 255 255 / .14); color: #FFFFFF; }
.round svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.hero-copy { position: absolute; left: max(22px, env(safe-area-inset-left, 0px)); right: 22px; top: calc(80px + env(safe-area-inset-top, 0px)); z-index: 2; display: flex; flex-direction: column; align-items: flex-start; gap: 10px; }
.lv-chip { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 10px 0 4px; border: 0; border-radius: 999px; background: rgb(255 255 255 / .14); color: #FFFFFF; font-size: 12px; font-weight: 600; }
.lv-chip b { display: grid; place-items: center; height: 20px; padding: 0 7px; border-radius: 999px; background: #FFD66B; color: #4A3A2A; font-size: 11px; }
.hero h1 { font-size: 30px; font-weight: 700; letter-spacing: -0.035em; line-height: 1.3; }
.hero h1 em { font-style: normal; color: var(--glow); }
.hero-set { display: inline-flex; align-items: center; gap: 6px; min-height: 40px; padding: 0 14px; border: 0; border-radius: 999px; background: rgb(255 255 255 / .16); color: #FFFFFF; font-size: 14px; font-weight: 600; }

.summary { position: relative; z-index: 3; margin: -34px 16px 0; padding: 18px 16px 16px; border-radius: var(--r-lg); background: var(--card); box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 14px; }
.summary-nums { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); }
.summary-nums > div { display: flex; flex-direction: column; align-items: center; gap: 2px; }

.summary-nums span { font-size: 13px; color: var(--faint); }
.summary-nums strong { font-size: 22px; font-weight: 700; letter-spacing: -0.03em; font-variant-numeric: tabular-nums; }

.quick { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px; padding: 0 0; }
.quick a, .quick button { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 0; border: 0; background: none; color: var(--ink); font-size: 13px; font-weight: 500; text-decoration: none; }

.quick .ico img { width: 38px; height: 38px; }

.stage { display: flex; flex-direction: column; gap: 14px; padding: 20px; border-radius: var(--r-lg); background: var(--mint); }

.steps { display: flex; gap: 4px; width: 100%; }
.steps i { flex: 1 1 0; min-width: 0; }
@media (max-width: 360px) { .steps { gap: 3px; } }
.steps i { height: 6px; border-radius: 999px; background: color-mix(in srgb, var(--brand) 18%, transparent); overflow: hidden; }
.steps i b { display: block; height: 100%; background: var(--brand); border-radius: inherit; width: var(--p, 0%); transition: width .6s var(--ease); }
.mission { display: flex; flex-direction: column; border-radius: var(--r); background: var(--card); }
.mission > span { padding: 12px 14px 6px; font-size: 13px; font-weight: 600; color: var(--sub); }
.mission-row { display: flex; align-items: center; gap: 12px; min-height: 56px; padding: 0 8px 0 14px; border-top: 1px solid var(--line); }
.mission > span + .mission-row { border-top: 0; }
.mission-row .name { flex: 1; min-width: 0; padding: 0; border: 0; background: none; text-align: left; font-size: 15px; }
.mission-row .xp { font-size: 13px; font-weight: 600; color: var(--brand-ink); }

.tip { display: flex; gap: 14px; padding: 18px; }
.tip p { font-size: 15px; line-height: 1.6; }
.tip small { display: block; margin-bottom: 6px; font-size: 12px; font-weight: 600; color: var(--sub); }
.tip a { display: inline-block; margin-top: 8px; font-size: 14px; font-weight: 600; text-decoration: none; }

@media (min-width: 900px) {
  .home-top { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 16px; padding: 32px 40px 0; max-width: 1120px; }
  .hero { height: auto; min-height: 380px; border-radius: 20px; }
  .summary { margin: 0; justify-content: space-between; padding: 24px; box-shadow: 0 0 0 1px var(--line); }
  .summary-nums strong { font-size: 26px; }
  .home-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 24px; align-items: start; }
}

/* ---------- 장비 ---------- */
.seg { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px; padding: 4px; border-radius: 13px; background: var(--line); }
.seg button { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 52px; border: 0; border-radius: 10px; background: transparent; color: var(--sub); font-size: 12px; font-weight: 500; transition: background-color .15s var(--ease), color .15s var(--ease); }
.seg button b { font-size: 17px; font-weight: 700; color: var(--ink); font-variant-numeric: tabular-nums; }
.seg button[aria-selected="true"] { background: var(--card); color: var(--brand); font-weight: 600; box-shadow: 0 1px 3px rgb(15 23 42 / .08); }
.seg button[aria-selected="true"] b { color: var(--brand); }
.chips { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; margin: 0 -16px; padding: 2px 16px; scroll-padding-inline: 16px; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; min-height: 36px; padding: 0 14px; border: 0; border-radius: 999px; background: var(--card); box-shadow: inset 0 0 0 1px var(--line-2); color: var(--sub); font-size: 14px; font-weight: 500; white-space: nowrap; }
.chip[aria-pressed="true"] { background: var(--brand); box-shadow: none; color: var(--on-brand); font-weight: 600; }
.search { display: flex; align-items: center; gap: 10px; min-height: 48px; padding: 0 6px 0 14px; border-radius: var(--r); background: var(--card); box-shadow: 0 0 0 1px var(--line-2); color: var(--faint); }
.search:focus-within { box-shadow: 0 0 0 2px var(--brand); }
.search svg { flex: none; width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; }
.search input { flex: 1; min-width: 0; min-height: 46px; border: 0; outline: 0; background: transparent; color: var(--ink); font-size: 16px; }
.search .clear { display: grid; place-items: center; width: 36px; height: 36px; border: 0; border-radius: 50%; background: transparent; color: var(--faint); }
.group-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 14px 16px 8px; font-size: 15px; font-weight: 700; }
.group-head small { font-size: 12.5px; font-weight: 400; color: var(--faint); }
.row { display: flex; align-items: center; gap: 12px; min-height: 68px; padding: 10px 6px 10px 12px; border-top: 1px solid var(--line); }
.group-head + .row { border-top: 0; }
.row-main { flex: 1; min-width: 0; display: flex; align-items: center; gap: 12px; padding: 0; border: 0; background: none; text-align: left; }
.row-text { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.row-title { display: flex; align-items: center; gap: 6px; min-width: 0; }
.row-title b { font-size: 15px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row-sub { font-size: 12.5px; color: var(--sub); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row-sub.est { color: var(--faint); }
.row-price { flex: none; text-align: right; font-size: 15px; font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
.row-price.est { font-size: 13px; font-weight: 500; color: var(--sub); }
.row.done .row-title b { color: var(--sub); }
.row-check { flex: none; display: grid; place-items: center; width: 44px; height: 44px; border: 0; border-radius: 50%; background: transparent; }
.row-check span { display: grid; place-items: center; width: 26px; height: 26px; border-radius: 50%; box-shadow: inset 0 0 0 2px var(--line-2); transition: background-color .2s var(--ease), box-shadow .2s var(--ease), transform .2s var(--ease); }
.row-check svg { width: 14px; height: 14px; fill: none; stroke: transparent; stroke-width: 3.2; stroke-linecap: round; stroke-linejoin: round; }
.row-check:hover span { box-shadow: inset 0 0 0 2px var(--brand); }
.row-check[aria-pressed="true"] span { background: var(--brand); box-shadow: none; }
.row-check[aria-pressed="true"] svg { stroke: var(--on-brand); }
.row-check.pop span { animation: pop .35s var(--ease); }
@keyframes pop { 40% { transform: scale(1.25); } }
.sumbar { position: sticky; bottom: calc(var(--tabbar-h) + env(safe-area-inset-bottom, 0px) + 12px); z-index: 5; display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 52px; padding: 0 18px; border-radius: var(--r); background: var(--ink); color: var(--card); box-shadow: var(--shadow); }
.sumbar span { font-size: 13px; opacity: .75; }
.sumbar strong { font-size: 17px; font-weight: 700; font-variant-numeric: tabular-nums; }
@media (min-width: 900px) { .sumbar { bottom: 16px; } }

/* ---------- 바텀시트 ---------- */
.sheet-wrap { position: fixed; inset: 0; z-index: 80; }
.sheet-backdrop { position: absolute; inset: 0; background: var(--dim); animation: fade .2s var(--ease); }
.sheet { position: absolute; left: 0; right: 0; bottom: 0; max-height: calc(100dvh - 48px - env(safe-area-inset-top, 0px)); display: flex; flex-direction: column; border-radius: 24px 24px 0 0; background: var(--card); box-shadow: var(--shadow); animation: up .28s var(--ease); outline: 0; }
.sheet.dragging { transition: none; }
.sheet.closing { transform: translateY(100%); transition: transform .22s var(--ease); }
@keyframes up { from { transform: translateY(100%); } }
@keyframes fade { from { opacity: 0; } }
.sheet-grip { display: flex; justify-content: center; padding: 8px 0 6px; touch-action: none; cursor: grab; }
.sheet-grip span { width: 40px; height: 5px; border-radius: 999px; background: var(--line-2); }
.sheet-body { overflow-y: auto; overscroll-behavior: contain; padding: 6px 20px calc(20px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 18px; }
.sheet-foot { position: sticky; bottom: calc(-20px - env(safe-area-inset-bottom, 0px)); margin: 0 -20px calc(-20px - env(safe-area-inset-bottom, 0px)); padding: 12px 20px calc(16px + env(safe-area-inset-bottom, 0px)); display: flex; gap: 8px; background: var(--card); box-shadow: 0 -1px 0 var(--line); }
@media (min-width: 900px) {
  .sheet { left: 50%; right: auto; bottom: 50%; width: min(560px, calc(100% - 48px)); max-height: min(760px, calc(100dvh - 48px)); transform: translate(-50%, 50%); border-radius: 24px; animation: pop-in .22s var(--ease); }
  .sheet.closing { transform: translate(-50%, 50%) scale(.97); opacity: 0; transition: transform .18s var(--ease), opacity .18s var(--ease); }
  .sheet-grip { display: none; }
  .sheet-body { padding-top: 22px; }
  @keyframes pop-in { from { opacity: 0; transform: translate(-50%, 50%) scale(.97); } }
}
.sheet-head { display: flex; align-items: center; gap: 14px; }
.sheet-head > div { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px; }
.sheet-head h2 { font-size: 22px; font-weight: 700; letter-spacing: -0.03em; line-height: 1.3; }
.sheet-head .tags { display: flex; flex-wrap: wrap; gap: 6px; }
.x { flex: none; align-self: flex-start; display: grid; place-items: center; width: 44px; height: 44px; margin: -6px -10px 0 0; border: 0; border-radius: 12px; background: transparent; color: var(--sub); }
.x svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; }
.note { display: flex; flex-direction: column; gap: 4px; padding: 14px 16px; border-radius: var(--r); background: var(--bg); }
.note small { font-size: 12px; font-weight: 600; color: var(--brand-ink); }
.note p { font-size: 14px; line-height: 1.65; }
.clamp { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.linkbtn { align-self: flex-start; padding: 4px 0; border: 0; background: none; color: var(--brand-ink); font-size: 13px; font-weight: 600; }
.status-seg { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px; padding: 4px; border-radius: 13px; background: var(--line); }
.status-seg button { min-height: 40px; border: 0; border-radius: 10px; background: transparent; color: var(--sub); font-size: 13px; font-weight: 500; }
.status-seg button[aria-pressed="true"] { background: var(--card); color: var(--brand); font-weight: 600; box-shadow: 0 1px 3px rgb(15 23 42 / .08); }
.pick { display: flex; flex-direction: column; gap: 4px; padding: 14px 16px; border-radius: var(--r); box-shadow: inset 0 0 0 1px var(--line-2); color: inherit; text-decoration: none; }
.pick.best { background: var(--soft); box-shadow: inset 0 0 0 1.5px var(--mint); }
.pick-top { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.pick-top b { display: flex; align-items: center; gap: 6px; font-size: 15px; font-weight: 600; }
.pick-top strong { font-size: 16px; font-weight: 700; white-space: nowrap; font-variant-numeric: tabular-nums; }
.pick p { font-size: 13px; color: var(--sub); line-height: 1.55; }
.sites { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
.site { display: flex; align-items: center; justify-content: center; min-height: 44px; border-radius: 12px; font-size: 13px; font-weight: 600; text-decoration: none; }
.s-dg { background: #FFF7ED; color: #C2410C; } .s-nv { background: #F0FDF4; color: #15803D; } .s-cf { background: #F0FDF4; color: #166534; } .s-dn { background: #EFF6FF; color: #1D4ED8; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .site { background: var(--tile); } }
.form { display: grid; gap: 12px; padding: 16px; border-radius: var(--r); background: var(--bg); }
.form h3 { font-size: 15px; font-weight: 700; }
.field { display: grid; gap: 6px; }
.field > span { font-size: 13px; font-weight: 600; color: var(--sub); }
.field input, .field select, .field textarea { width: 100%; min-height: 48px; padding: 0 14px; border: 0; border-radius: 12px; background: var(--card); box-shadow: inset 0 0 0 1px var(--line-2); color: var(--ink); font-size: 16px; }
.field textarea { min-height: 88px; padding: 12px 14px; resize: vertical; line-height: 1.5; }
.field input:focus, .field select:focus, .field textarea:focus { outline: 0; box-shadow: inset 0 0 0 2px var(--brand); }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.pills { display: flex; gap: 6px; }

/* ---------- 알아보기 ---------- */
.cards2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.tile-card { display: flex; flex-direction: column; justify-content: space-between; gap: 16px; min-height: 124px; padding: 16px; border: 0; border-radius: var(--r-lg); background: var(--card); box-shadow: 0 0 0 1px var(--line); color: var(--ink); text-align: left; font-size: 15px; font-weight: 600; line-height: 1.35; }
.tile-card img { width: 40px; height: 40px; }
.tile-card em { font-style: normal; color: var(--warn); }
.link-row { display: flex; align-items: center; gap: 12px; width: 100%; min-height: 60px; padding: 8px 16px 8px 12px; border: 0; border-top: 1px solid var(--line); background: none; color: inherit; text-align: left; text-decoration: none; }
.list > .link-row:first-child { border-top: 0; }
.link-row b { flex: 1; min-width: 0; font-size: 15px; font-weight: 500; }
.link-row small { font-size: 12.5px; color: var(--faint); text-align: right; }
.bullets { margin: 0; padding-left: 20px; display: grid; gap: 10px; font-size: 15px; line-height: 1.65; }
.bullets li::marker { color: var(--brand); }
.src { font-size: 12px; color: var(--faint); }

/* ---------- 기록 ---------- */
.lesson { display: flex; flex-direction: column; gap: 10px; padding: 18px; }
.lesson.done { background: var(--soft); box-shadow: none; }
.lesson-top { display: flex; align-items: center; gap: 10px; }
.lesson-top b { flex: 1; font-size: 16px; font-weight: 600; }
.lesson-n { display: grid; place-items: center; width: 26px; height: 26px; border-radius: 8px; background: var(--tile); font-size: 13px; font-weight: 700; }
.lesson.done .lesson-n { background: var(--brand); color: var(--on-brand); }
.lesson p { font-size: 14px; line-height: 1.65; color: var(--sub); }
.mini-items { display: flex; flex-wrap: wrap; gap: 6px; }
.mini-item { display: inline-flex; align-items: center; gap: 6px; min-height: 36px; padding: 0 12px 0 6px; border: 0; border-radius: 999px; background: var(--tile); color: var(--ink); font-size: 13px; font-weight: 500; }
.mini-item img { width: 24px; height: 24px; }
.mini-item.have { background: var(--mint); color: var(--brand-ink); }
.stat3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); padding: 16px 8px; }
.stat3 > div { display: flex; flex-direction: column; align-items: center; gap: 2px; }
.stat3 > div + div { border-left: 1px solid var(--line); }
.stat3 span { font-size: 12.5px; color: var(--faint); }
.stat3 strong { font-size: 18px; font-weight: 700; font-variant-numeric: tabular-nums; }
.lv-list { display: flex; flex-direction: column; gap: 8px; }
.lv-item { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: var(--r); box-shadow: inset 0 0 0 1px var(--line-2); }
.lv-item.now { background: var(--soft); box-shadow: inset 0 0 0 1.5px var(--mint); }
.lv-item.locked { opacity: .55; }
.lv-item b { flex: 1; font-size: 15px; font-weight: 600; }
.lv-item span { font-size: 13px; color: var(--sub); }

/* ---------- 토스트 ---------- */
.toast { position: fixed; left: 50%; bottom: calc(var(--tabbar-h) + env(safe-area-inset-bottom, 0px) + 76px); z-index: 90; display: flex; align-items: center; gap: 4px; width: max-content; max-width: min(480px, calc(100% - 32px)); min-height: 52px; padding: 0 8px 0 18px; border-radius: 14px; background: var(--ink); color: var(--card); box-shadow: var(--shadow); font-size: 15px; font-weight: 500; transform: translateX(-50%); animation: toast-in .28s var(--ease); }
.toast > span { flex: 1; min-width: 0; padding-right: 6px; }
.toast button { flex: none; white-space: nowrap; min-height: 40px; padding: 0 12px; border: 0; border-radius: 10px; background: transparent; color: var(--glow); font-size: 14px; font-weight: 600; }
@keyframes toast-in { from { opacity: 0; transform: translate(-50%, 12px); } }
@media (min-width: 900px) { .toast { bottom: 88px; } }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
}

/* ---------- 쿠팡 파트너스 ---------- */
.cp-card { display: flex; flex-direction: column; gap: 10px; padding: 16px; border-radius: var(--r); background: var(--card); box-shadow: inset 0 0 0 1px var(--line-2); }
.cp-top { display: flex; align-items: center; justify-content: space-between; }
.cp-logo { display: grid; place-items: center; height: 22px; padding: 0 8px; border-radius: 6px; background: #EF3A2E; color: #FFFFFF; font-size: 11px; font-weight: 700; }
.cp-ad { display: grid; place-items: center; height: 22px; padding: 0 8px; border-radius: 6px; box-shadow: inset 0 0 0 1px var(--line-2); color: var(--sub); font-size: 11px; font-weight: 600; }
.cp-body { display: flex; flex-direction: column; gap: 2px; }
.cp-body b { font-size: 15px; font-weight: 600; line-height: 1.45; }
.cp-body strong { display: flex; align-items: center; gap: 6px; font-size: 18px; font-weight: 700; }
.cp-disc { margin: 0; padding-top: 10px; border-top: 1px solid var(--line); color: var(--sub); font-size: 12.5px; line-height: 1.55; }
.foot-note { display: grid; gap: 8px; margin: 16px 0 0; padding: 20px 4px 8px; border-top: 1px solid var(--line); color: var(--sub); font-size: 12.5px; line-height: 1.65; }
.foot-note p { margin: 0; }
.foot-note b { font-weight: 600; color: var(--ink); }
.pick-acts { display: flex; align-items: center; gap: 12px; margin-top: 6px; }
.pick-acts .btn { min-width: 120px; }
.pick-acts .linkbtn { text-decoration: none; color: var(--sub); }
.cp-disc { display: flex; align-items: flex-start; gap: 6px; border-top: 0; padding-top: 0; }
.cp-disc .cp-ad { flex: none; height: 20px; }
.pick-acts .cp-logo { margin-right: 2px; }

/* ---------- 레벨 업 축하 ---------- */
.lvup { position: fixed; inset: 0; z-index: 95; display: grid; place-items: end center; background: rgb(8 12 24 / .72); animation: fade .25s var(--ease); }
.lvup-card { width: 100%; max-width: 520px; overflow: hidden; border-radius: 26px 26px 0 0; background: var(--card); box-shadow: var(--shadow); animation: up .45s var(--ease); }
.lvup-scene { position: relative; aspect-ratio: 640 / 360; background: linear-gradient(180deg, var(--night-1), var(--night-2)); }
.lvup-scene svg { display: block; width: 100%; height: 100%; animation: lvup-zoom 1.2s var(--ease); }
@keyframes lvup-zoom { from { transform: scale(1.12); filter: brightness(.6); } }
.lvup-text { display: flex; flex-direction: column; gap: 8px; padding: 22px 22px calc(22px + env(safe-area-inset-bottom, 0px)); text-align: center; }
.lvup-eyebrow { align-self: center; padding: 4px 12px; border-radius: 999px; background: #FFD66B; color: #4A3A2A; font-size: 13px; font-weight: 700; animation: pop .6s var(--ease) .3s both; }
.lvup-text h2 { font-size: 24px; font-weight: 700; letter-spacing: -0.03em; }
.lvup-text p { color: var(--sub); font-size: 15px; line-height: 1.6; }
.lvup-text small { color: var(--brand-ink); font-size: 13px; font-weight: 600; }
.lvup-text .btn { margin-top: 10px; }
@media (min-width: 900px) { .lvup { place-items: center; } .lvup-card { border-radius: 26px; } }

/* QA: 손가락으로 누르기 쉬운 크기 맞추기 */
.mission-row .name { align-self: stretch; min-height: 44px; }
.sec-head .more { min-height: 44px; display: inline-flex; align-items: center; }
.tip a { min-height: 44px; display: inline-flex; align-items: center; margin-top: 2px; }
.lv-chip { height: 32px; }
.linkbtn { min-height: 40px; }

/* ---------- 공유 상태 ---------- */
.sync-banner { position: fixed; left: 50%; top: calc(10px + env(safe-area-inset-top, 0px)); z-index: 70; transform: translateX(-50%); max-width: calc(100% - 32px); padding: 8px 14px; border-radius: 999px; background: var(--card); box-shadow: var(--shadow); color: var(--sub); font-size: 13px; font-weight: 600; }
