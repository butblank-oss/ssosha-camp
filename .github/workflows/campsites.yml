# 고캠핑 공공데이터로 캠핑장 목록(campsites.json)을 매주 새로 받아요.
# 필요한 시크릿: GOCAMPING_KEY (공공데이터포털 '한국관광공사_고캠핑 정보 조회서비스' 일반 인증키, Decoding)
name: 캠핑장 목록 받기

on:
  workflow_dispatch:
  schedule:
    - cron: "17 18 * * 0"   # 매주 월요일 오전 3시 17분 (한국 시간)

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 캠핑장 목록 받기
        env:
          GOCAMPING_KEY: ${{ secrets.GOCAMPING_KEY }}
        run: python .github/scripts/fetch_campsites.py
      - name: 바뀌었으면 저장
        run: |
          git config user.name "sosha-camp-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add campsites.json
          git diff --cached --quiet || (git commit -m "캠핑장 목록 새로 받기" && git push)
