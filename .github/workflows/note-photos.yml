# 캠핑수첩(note/)에 붙일 고캠핑(한국관광공사) 사진·정보·주변 추천을 note/gocamping.json으로 저장해요.
# 필요한 시크릿: GOCAMPING_KEY (쏘샤캠프와 같은 키). 키는 여기서만 쓰고 페이지에는 들어가지 않아요.
name: 캠핑수첩 고캠핑 정보 받기

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["note/camps.json", ".github/scripts/fetch_note_gocamping.py"]
  schedule:
    - cron: "41 18 * * 0"   # 매주 월요일 오전 3시 41분 (한국 시간), 캠핑장 목록 받기 뒤에

permissions:
  contents: write

jobs:
  photos:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 고캠핑 정보 받기
        env:
          GOCAMPING_KEY: ${{ secrets.GOCAMPING_KEY }}
        run: python .github/scripts/fetch_note_gocamping.py
      - name: 바뀌었으면 저장
        run: |
          git config user.name "sosha-camp-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add note/gocamping.json
          git diff --cached --quiet || (git commit -m "캠핑수첩 고캠핑 정보 새로 받기" && git pull --rebase && git push)
